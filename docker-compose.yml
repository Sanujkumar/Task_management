version: '3.8'

services:
  web:
    build: .
    container_name: nextjs-app
    ports:
      - "3000:3000"
    env_file: .env 
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:  
